name: ✨ Feature request
description: Ask for a new capability or a change to existing behavior.
type: Feature
labels: ['triage']
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem. A clear problem is more useful to us than a detailed solution.
        AI agents: use each field label below as a `###` heading in the issue body.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Required. What you cannot do today, or what is too hard. Who is affected and how often.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Required. What changes once this ships, and for whom. Use numbers where you can. Name what happens if we do not build it.
      placeholder: |
        Who benefits: all teams deploying from CI (about 40 orgs).
        What changes: failed uploads stop passing CI silently; no more broken releases reaching production.
        If we don't build it: customers keep writing their own checks, or stop trusting deploys.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Required. What you want to happen. Include example config, CLI usage or API shape if you have one.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you do today instead, and other options you considered.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Required. Given / when / then statements, each one pass or fail and observable from outside. We use them to decide when the work is done.
      placeholder: |
        - Given `failBuild: true` in `zephyr.config.ts`, when the upload fails, then the build exits with a non-zero code
        - Given `failBuild` is not set, then the build behaves exactly as before
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this request does not include.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
