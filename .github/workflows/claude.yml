name: Claude Code

concurrency:
  group: claude-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude_gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout actions manifest
        uses: actions/checkout@v4
        with:
          repository: ZephyrCloudIO/.github
          ref: ${{ github.repository == 'ZephyrCloudIO/.github' && github.sha || 'main' }}
          path: workflow-manifest

      - name: Preflight yq availability
        run: |
          set -euo pipefail

          if ! command -v yq >/dev/null 2>&1; then
            echo "::error::yq is required to read the actions manifest"
            exit 1
          fi

          yq --version

      - name: Check Claude repository skip list
        id: check
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_PATH: .github/workflows/claude.yml
          MANIFEST_PATH: workflow-manifest/.github/actions-manifest.yml
        run: |
          set -euo pipefail

          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "::error::Actions manifest not found at $MANIFEST_PATH"
            exit 1
          fi

          skipped_repository="$(yq -r '
            .actions[]?
            | select(.workflow_path == strenv(WORKFLOW_PATH))
            | .skipped_repositories[]?
            | select(. == strenv(REPOSITORY))
          ' "$MANIFEST_PATH")"

          if [ -n "$skipped_repository" ]; then
            echo "Claude disabled for $REPOSITORY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Claude enabled for $REPOSITORY"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  claude:
    needs: claude_gate
    if: |
      needs.claude_gate.outputs.enabled == 'true' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude please review')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude please review')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && !contains(github.event.review.body, '@claude please review')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@a60f3e1db3edbceed2b1e6c6a9d34c36b8a15eba # v1.0.209
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5

  pr_review_summary:
    needs: claude_gate
    if: |
      needs.claude_gate.outputs.enabled == 'true' &&
      (
        (
          github.event_name == 'pull_request' &&
          !contains(fromJSON('["dependabot[bot]","renovate[bot]","app/renovate"]'), github.event.pull_request.user.login)
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          contains(fromJSON('["dependabot[bot]","renovate[bot]","app/renovate"]'), github.event.pull_request.user.login)
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Dismiss stale Claude approvals
        if: |
          github.event_name == 'pull_request_target' &&
          contains(fromJSON('["dependabot[bot]","renovate[bot]","app/renovate"]'), github.event.pull_request.user.login)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" \
            | jq -r 'flatten[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id' \
            | while read -r review_id; do
                gh api --method PUT \
                  "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews/$review_id/dismissals" \
                  --field message="Claude is reviewing the current PR head"
              done

      - name: Prepare pull request diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" > .claude-review.diff

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@a60f3e1db3edbceed2b1e6c6a9d34c36b8a15eba # v1.0.209
        with:
          allowed_bots: dependabot[bot],renovate[bot],app/renovate
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5
            --json-schema '{"type":"object","properties":{"comment_body":{"type":"string"},"approve":{"type":"boolean"},"approval_reason":{"type":"string"}},"required":["comment_body","approve","approval_reason"],"additionalProperties":false}'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}
            DRAFT: ${{ github.event.pull_request.draft }}
            APPROVAL ELIGIBLE: ${{ github.event_name == 'pull_request_target' && (github.event.sender.id == 49699333 || github.event.sender.id == 29139614) }}

            Read `.claude-review.diff` first. Review only that change. Read repository instructions
            when needed to judge a finding.
            Check correctness, security, compatibility, concurrency, performance, and missing tests or
            docs when behavior changes. Apply the repository's own conventions. Do not invent style
            rules or report pre-existing problems.

            Report only findings that are specific and actionable. For each one, give its severity,
            file and line, failure mode, and smallest sound fix. Skip praise, restatements, and nits.

            Return `comment_body` as GitHub-flavored Markdown in this shape:

            <details>
            <summary>Claude review</summary>

            - Purpose: one sentence
            - Findings: severity table, or "No actionable findings"
            - Verification gaps: tests or evidence still needed
            - Verdict: ready or needs changes

            </details>

            End with: `@claude please review` triggers an inline review.

            Set `approve` to true only when APPROVAL ELIGIBLE is true, DRAFT is false, and you are
            confident the dependency update is safe. No one needs to ask you. Set it to false when
            evidence is missing or a substantive finding remains. Keep `approval_reason` to one sentence.

      - name: Publish review summary
        env:
          CLAUDE_DECISION: ${{ steps.claude.outputs.structured_output }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          body="$(jq -er '.comment_body | select(type == "string" and length > 0)' <<< "$CLAUDE_DECISION")"
          marker="<!-- claude-review-summary -->"
          body="$marker"$'\n'"$body"
          comment_id="$(
            gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- claude-review-summary -->"))) | .id' \
              | tail -n 1
          )"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --field body="$body"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$body"
          fi

      - name: Approve trusted dependency PR
        if: |
          github.event_name == 'pull_request_target' &&
          (github.event.sender.id == 49699333 || github.event.sender.id == 29139614)
        env:
          CLAUDE_DECISION: ${{ steps.claude.outputs.structured_output }}
          EVENT_ACTOR_ID: ${{ github.event.sender.id }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! jq -e '.approve == true' <<< "$CLAUDE_DECISION" >/dev/null; then
            echo "Claude declined approval"
            exit 0
          fi

          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          author="$(jq -r '.user.login' <<< "$pr")"
          author_id="$(jq -r '.user.id' <<< "$pr")"
          current_head="$(jq -r '.head.sha' <<< "$pr")"
          draft="$(jq -r '.draft' <<< "$pr")"
          head_repository="$(jq -r '.head.repo.full_name' <<< "$pr")"

          case "$author" in
            "dependabot[bot]" | "renovate[bot]" | "app/renovate") ;;
            *)
              echo "::error::Refusing to approve PR from $author"
              exit 1
              ;;
          esac

          case "$author_id:$EVENT_ACTOR_ID" in
            "49699333:49699333" | "29139614:29139614") ;;
            *)
              echo "::error::PR author and event actor are not the same trusted dependency bot"
              exit 1
              ;;
          esac

          if [ "$draft" != "false" ]; then
            echo "Claude approval skipped for draft PR"
            exit 0
          fi

          if [ "$head_repository" != "$REPOSITORY" ]; then
            echo "::error::Refusing to approve a dependency PR from a fork"
            exit 1
          fi

          if [ "$current_head" != "$EXPECTED_HEAD" ]; then
            echo "::error::PR head changed during review"
            exit 1
          fi

          commits="$(
            gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/commits" | jq 'flatten'
          )"
          if ! jq -e --argjson bot_id "$author_id" '
            length > 0 and
            all(.[];
              .author.id == $bot_id and
              .committer.login == "web-flow" and
              .commit.verification.verified == true and
              .commit.verification.reason == "valid"
            )
          ' <<< "$commits" >/dev/null; then
            echo "::error::Refusing to approve a dependency PR without verified bot-only commits"
            exit 1
          fi

          reason="$(jq -r '.approval_reason' <<< "$CLAUDE_DECISION")"
          gh api --method POST "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --field commit_id="$EXPECTED_HEAD" \
            --field event=APPROVE \
            --field body="Claude review: $reason"

  code_review:
    needs: claude_gate
    if: |
      needs.claude_gate.outputs.enabled == 'true' &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude please review')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude please review'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare pull request context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" > .claude-review.diff
          gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/comments" \
            | jq 'flatten' > .claude-review-comments.json

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@a60f3e1db3edbceed2b1e6c6a9d34c36b8a15eba # v1.0.209
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"comment_body":{"type":"string"}},"required":["comment_body"],"additionalProperties":false}'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
            PR AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}

            Read `.claude-review.diff` and `.claude-review-comments.json` first. Review only the
            change. Read repository instructions when needed to judge a finding.
            Check correctness, security, compatibility, concurrency, performance, and missing tests or
            docs when behavior changes. Apply the repository's own conventions. TypeScript must remain
            strict-compatible. Do not invent style rules or report pre-existing problems.

            Report only findings that are specific and actionable. Use
            `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`. Anchor each
            finding to the narrowest changed line. State the failure mode and smallest sound fix.
            Do not duplicate existing feedback. Skip praise, restatements, and nits.

            Return `comment_body` as a short GitHub-flavored Markdown summary. Include the finding count
            by severity, verification gaps, and a ready or needs-changes verdict.

      - name: Publish inline review summary
        env:
          CLAUDE_RESULT: ${{ steps.claude.outputs.structured_output }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          body="$(jq -er '.comment_body | select(type == "string" and length > 0)' <<< "$CLAUDE_RESULT")"
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$body"
